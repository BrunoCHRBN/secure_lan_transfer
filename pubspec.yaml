name: secure_lan_transfer
description: "Cross-platform secure LAN file transfer application with E2EE, traffic obfuscation, and zero-metadata staging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  crypto: ^3.0.6
  convert: ^3.1.2
  multicast_dns: ^0.3.3+1
  file_picker: 8.1.7
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  archive: ^4.2.0
  shared_preferences: ^2.5.5
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true
